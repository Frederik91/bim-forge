name: Validate factory policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    name: Policy and repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: Check changed paths on pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/validate-policy.ts --changed-files "$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
